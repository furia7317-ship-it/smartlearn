<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>学枢</title>
    <style>
      :root {
        --ink-0: #1c1c20;
        --ink-1: #29292e;
        --ink-2: #34343b;
        --line: #45454e;
        --fg: #e8e8ea;
        --muted: #9a9aa4;
        --vermilion: #c25d49;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        background: radial-gradient(120% 120% at 50% 0%, var(--ink-2) 0%, var(--ink-1) 45%, var(--ink-0) 100%);
        color: var(--fg);
        font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        user-select: none;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; }
      .seal {
        width: 96px; height: 96px; border-radius: 18px;
        box-shadow: 0 10px 36px rgba(194, 93, 73, 0.35);
        object-fit: cover;
      }
      .title { font-size: 22px; letter-spacing: 6px; font-weight: 600; }
      .title small { display:block; margin-top:8px; font-size:11px; letter-spacing:3px; color: var(--muted); font-weight: 400; }
      .bar {
        width: 240px; height: 3px; border-radius: 3px; overflow: hidden;
        background: var(--ink-2); border: 1px solid var(--line);
      }
      .bar > i {
        display: block; height: 100%; width: 40%;
        background: linear-gradient(90deg, transparent, var(--vermilion), transparent);
        animation: slide 1.25s ease-in-out infinite;
      }
      @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(350%);} }
      .status { font-size: 13px; color: var(--muted); min-height: 18px; letter-spacing: 0.5px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="seal" src="../out/brand/xueshu-app-icon.png" alt="" />
      <div class="title">学枢<small>AI 个性化学习工作台</small></div>
      <div class="bar"><i></i></div>
      <div class="status" id="status">正在初始化…</div>
    </div>
    <script>
      window.__setStatus = function (t) {
        var el = document.getElementById("status");
        if (el) el.textContent = t;
      };
    </script>
  </body>
</html>
