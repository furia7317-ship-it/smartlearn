worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 100m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    map $http_x_forwarded_proto $upstream_scheme { default $scheme; https https; }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
        location = /backend { return 308 /backend/; }
        location ^~ /backend/ {
            proxy_pass http://smartlearn-backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $upstream_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        # Content-addressed build artifacts are safe to retain across releases.
        location ^~ /_next/static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
        location ^~ /vendor/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options nosniff always;
        }
        # Public artwork/audio keep their original bytes. Mutable names are not
        # immutable: at most one hour stale if a release replaces the same URL.
        # Use a new versioned filename when a visual update must appear at once.
        location ^~ /brand/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header X-Content-Type-Options nosniff always;
        }
        location ^~ /audio/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header X-Content-Type-Options nosniff always;
        }
        location ^~ /voice-assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            if ($http_x_forwarded_proto != "https") {
                return 308 https://furia7317.art$request_uri;
            }
            try_files $uri $uri/ $uri.html /index.html;
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Referrer-Policy same-origin always;
        }
    }
}
