[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartlearn-backend"
version = "0.1.0"
description = "学枢后端 — FastAPI + LangGraph 多智能体编排"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "chromadb>=0.5",
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux'",
    "sentence-transformers>=3.0",
    "python-pptx>=0.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "websockets>=12.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-multipart>=0.0.9",
    "Pillow>=10.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
    "agent_run_db: tests that exercise the real Agent Run persistence service",
]

[tool.setuptools.packages.find]
include = ["app*"]
